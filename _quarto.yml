project:
  type: book
  output-dir: _book

book:
  title: "Code Python, Consult AI: Python Fundamentals for the AI Era"
  author: "Michael Borck"
  license: "CC BY-SA 4.0 (content), MIT (code examples)"
  chapters:
    - index.qmd
    - copyright.qmd
    - chapters/python_in_the_age_of_ai.qmd
    - chapters/hello_world.qmd
    - chapters/basic_python_syntax.qmd
    - chapters/values.qmd
    - chapters/variables.qmd
    - chapters/output.qmd
    - chapters/input.qmd
    - chapters/operators.qmd
    - chapters/using_functions.qmd
    - chapters/creating_functions.qmd
    - chapters/making_decisions.qmd
    - chapters/lists.qmd
    - chapters/going_loopy.qmd
    - chapters/strings.qmd
    - chapters/dictionaries.qmd
    - chapters/files.qmd
    - chapters/errors_and_exceptions.qmd
    - chapters/debugging.qmd
    - chapters/testing.qmd
    - chapters/modules_and_packages.qmd
    - chapters/orientating_your_objects.qmd
    - chapters/how_to_run_python_code.qmd
    - chapters/how_to_install_python_testing.qmd
    - chapters/getting_help.qmd
    - chapters/ai_programming_assistants.qmd
    - chapters/python_ai_integration.qmd
    - chapters/ai_assistance_tips.qmd
    - chapters/intentional_prompting.qmd
    - chapters/chatbot_project.qmd
    - acknowledgments.qmd
    - about-author.qmd

  downloads: [pdf, epub]
  repo-url: https://github.com/michael-borck/code-python-consult-ai
  repo-actions: [edit, issue]

website:
  favicon: favicon.svg
  repo-url: https://github.com/michael-borck/code-python-consult-ai
  repo-actions: [edit, issue]
  open-graph: true

bibliography: references.bib

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    cover-image: images/cover.png
    code-copy: true
    code-tools: true
    highlight-style: github
    toc: true
    toc-depth: 3
    number-sections: true
    downloads: [pdf, epub]
  pdf:
    documentclass: scrbook
    toc: true
    number-sections: true
    toc-depth: 3
    colorlinks: true
    cover-image: images/cover.png
  epub:
    toc: true
    toc-depth: 3
    cover-image: images/cover.png

execute:
  enabled: false
  freeze: auto
